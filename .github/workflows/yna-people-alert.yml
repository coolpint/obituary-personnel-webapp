name: YNA People Alert
run-name: "YNA People Alert ${{ inputs.slot || github.event.schedule }}"

on:
  schedule:
    # KST 10:07
    - cron: "7 1 * * *"
    # KST 18:07
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Scheduled KST slot, e.g. 2026-10-20T10:07+09:00 (required for dispatch)"
        required: true
        type: string

concurrency:
  group: yna-people-alert
  cancel-in-progress: false

jobs:
  run-alert:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    env:
      RSS_URL: https://www.yna.co.kr/rss/people.xml
      OFFICE_LIST_URL: https://news.naver.com/main/officeList.naver
      DAUM_CPLIST_URL: https://news.daum.net/cplist
      MEDIA_SCORE_THRESHOLD: ${{ vars.MEDIA_SCORE_THRESHOLD || '5' }}
      REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '15' }}
      INCLUDE_SUMMARY_IN_ALERT: ${{ vars.INCLUDE_SUMMARY_IN_ALERT || 'true' }}
      ALERT_SUMMARY_MAX_CHARS: ${{ vars.ALERT_SUMMARY_MAX_CHARS || '500' }}
      OUTLET_REFRESH_HOURS: "12"
      DB_PATH: ./state/data/yna_people_alert.db
      OUTLET_CACHE_PATH: ./state/data/outlets_cache.json
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_MENTION: ${{ vars.SLACK_MENTION || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Checkout durable state (missing state fails closed)
        uses: actions/checkout@v4
        with:
          ref: alert-state
          path: state

      - name: Read immutable run creation time
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "RUN_CREATED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .created_at)" >> "$GITHUB_ENV"

      - name: Run slot with durable checkpoints
        env:
          STATE_CHECKOUT: ./state
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m yna_people_alert.scheduled

      - name: Notify failure to Slack
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          schedule = os.environ.get("EVENT_SCHEDULE", "").strip()
          trigger = f"schedule {schedule}" if schedule else os.environ["EVENT_NAME"]
          text = (
              "[경고] YNA People Alert 실행 실패\n"
              f"저장소: {os.environ['REPOSITORY']}\n"
              f"트리거: {trigger}\n"
              f"로그: {os.environ['RUN_URL']}"
          )
          payload = json.dumps({"text": text}).encode("utf-8")
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15):
              pass
          PY
