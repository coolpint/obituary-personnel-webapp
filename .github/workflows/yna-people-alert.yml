name: YNA People Alert

on:
  schedule:
    # KST 10:07
    - cron: "7 1 * * *"
    # KST 18:07
    - cron: "7 9 * * *"
  workflow_dispatch:

concurrency:
  group: yna-people-alert
  cancel-in-progress: false

jobs:
  run-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RSS_URL: https://www.yna.co.kr/rss/people.xml
      OFFICE_LIST_URL: https://news.naver.com/main/officeList.naver
      DAUM_CPLIST_URL: https://news.daum.net/cplist
      MEDIA_SCORE_THRESHOLD: ${{ vars.MEDIA_SCORE_THRESHOLD || '5' }}
      REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '15' }}
      INCLUDE_SUMMARY_IN_ALERT: ${{ vars.INCLUDE_SUMMARY_IN_ALERT || 'true' }}
      ALERT_SUMMARY_MAX_CHARS: ${{ vars.ALERT_SUMMARY_MAX_CHARS || '500' }}
      OUTLET_REFRESH_HOURS: "12"
      DB_PATH: ./data/yna_people_alert.db
      OUTLET_CACHE_PATH: ./data/outlets_cache.json
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_MENTION: ${{ vars.SLACK_MENTION || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: yna-people-alert-data-${{ github.run_id }}
          restore-keys: |
            yna-people-alert-data-

      - name: Run once
        run: python -m yna_people_alert.main --once

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: yna-people-alert-data-${{ github.run_id }}

      - name: Notify failure to Slack
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          schedule = os.environ.get("EVENT_SCHEDULE", "").strip()
          trigger = f"schedule {schedule}" if schedule else os.environ["EVENT_NAME"]
          text = (
              "[경고] YNA People Alert 실행 실패\n"
              f"저장소: {os.environ['REPOSITORY']}\n"
              f"트리거: {trigger}\n"
              f"로그: {os.environ['RUN_URL']}"
          )
          payload = json.dumps({"text": text}).encode("utf-8")
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15):
              pass
          PY

      - name: Send daily heartbeat to Slack
        if: ${{ success() && github.event_name == 'schedule' && github.event.schedule == '7 9 * * *' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          text = (
              "[정상] YNA People Alert heartbeat\n"
              "오늘 저녁 스케줄 실행이 정상 완료되었습니다.\n"
              f"저장소: {os.environ['REPOSITORY']}\n"
              f"로그: {os.environ['RUN_URL']}"
          )
          payload = json.dumps({"text": text}).encode("utf-8")
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15):
              pass
          PY
